<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Task Manager</h1>
    <form id="task-form">
      <label for="title">New task</label>
      <div class="form-row">
        <input type="text" id="title" placeholder="What needs to be done?" maxlength="255" required>
        <button type="submit">Add</button>
      </div>
      <p id="error" class="error hidden"></p>
    </form>
    <section>
      <h2>Tasks</h2>
      <ul id="task-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
