name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome for Testing and matching chromedriver
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Install Python test dependencies
        run: |
          python3 -m venv e2e/.venv
          e2e/.venv/bin/pip install --upgrade pip
          e2e/.venv/bin/pip install -r e2e/requirements.txt

      - name: Run e2e tests
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: e2e/.venv/bin/python -m pytest -v
