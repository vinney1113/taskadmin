name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome for Testing and matching chromedriver
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true

      - name: Install Python test dependencies
        run: |
          python3 -m venv e2e/.venv
          e2e/.venv/bin/pip install --upgrade pip
          e2e/.venv/bin/pip install -r e2e/requirements.txt

      - name: Run e2e tests
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: e2e/.venv/bin/python -m pytest -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
