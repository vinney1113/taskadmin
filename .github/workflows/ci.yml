name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/taskadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Chrome for Testing and matching chromedriver
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true

      - name: Install Node dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Install Python test dependencies
        run: |
          python3 -m venv e2e/.venv
          e2e/.venv/bin/pip install --upgrade pip
          e2e/.venv/bin/pip install -r e2e/requirements.txt

      - name: Run e2e tests
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.chrome.outputs.chromedriver-path }}
        run: e2e/.venv/bin/python -m pytest -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site/vendor
          cp index.html styles.css app.js _site/
          cp vendor/* _site/vendor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
